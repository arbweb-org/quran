<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المصحف المرتل</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .container {
            direction: ltr;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }

        .store-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 8px 8px;
            background: #000000;
            border: none;
            border-radius: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            cursor: pointer;
        }

            .store-btn:hover {
                background: #1a1a1a;
                transform: translateY(-4px);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
            }

            .store-btn:active {
                transform: translateY(-2px);
            }

        .store-icon {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

            .store-icon svg {
                width: 100%;
                height: 100%;
                fill: currentColor;
                display: block;
            }

        .store-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
        }

        .store-label {
            font-size: 14px;
            opacity: 0.7;
            font-weight: 400;
        }

        .store-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* على الموبايل - يصبح عمودي */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .store-btn {
                padding: 10px 10px;
            }

            .store-name {
                font-size: 20px;
            }
        }

        /* عنوان توضيحي */
        .title {
            text-align: center;
            margin-bottom: 40px;
        }

        .app-icon {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 24px;
        }

        .title h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .title p {
            color: #6b7280;
            font-size: 16px;
        }

        /* Features Section */
        .features {
            max-width: 800px;
            margin: 0 auto 40px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .features-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 16px;
            color: #1a1a1a;
        }

        .checkmark {
            width: 24px;
            height: 24px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
            font-weight: bold;
            margin-top: 2px;
        }

        .download-header {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        /* Accessibility */
        .store-btn:focus {
            outline: 2px solid #4F46E5;
            outline-offset: 2px;
        }

            .store-btn:focus:not(:focus-visible) {
                outline: none;
            }
    </style>
</head>
<body>
    <div class="title">
        <div class="app-icon">
            <img src="icon.svg" style="width:200px; height:200px" />
        </div>
        <h1>المصحف المرتل</h1>
        <p>استمع إلى القرآن الكريم بأفضل الأصوات</p>
    </div>

    <div class="features">
        <div class="features-list">
            <div class="feature-item">
                <div class="checkmark">✓</div>
                <span>يعمل في الخلفية وعند قفل الشاشة</span>
            </div>
            <div class="feature-item">
                <div class="checkmark">✓</div>
                <span>أزرار التحكم في لوحة الإشعارات وشاشة القفل</span>
            </div>
            <div class="feature-item">
                <div class="checkmark">✓</div>
                <span>البحث عن قارئ والبحث عن سورة</span>
            </div>
        </div>
    </div>

    <h2 class="download-header">حمّل التطبيق الآن!</h2>
